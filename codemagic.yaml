# Codemagic CI — app LMDS (Flutter)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

definitions:
  environment: &env
    flutter: stable
    java: 17
  scripts:
    - &pub_get
      name: Dependências
      script: flutter pub get
    - &analyze
      name: Análise estática
      script: flutter analyze --no-fatal-infos --no-fatal-warnings
    - &test
      name: Testes
      script: flutter test

workflows:
  # Android: APK (instalar direto no telemóvel) + AAB (Google Play).
  # Assinatura: por omissão o release sai assinado com a chave de debug
  # (serve para instalar à mão). Para a Play Store, carrega a keystore em
  # Team settings > Code signing identities com a referência "lmds_keystore"
  # e descomenta o bloco android_signing.
  android:
    name: LMDS Android
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      <<: *env
      # android_signing:
      #   - lmds_keystore
    triggering:
      events: [push]
      branch_patterns:
        - pattern: master
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - *pub_get
      - *analyze
      - *test
      - name: Build APK
        script: flutter build apk --release --build-number=$BUILD_NUMBER
      - name: Build AAB
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - antoniopontopedro@gmail.com
        notify:
          success: true
          failure: true

  # iOS sem assinatura: valida que compila e gera um .ipa não assinado
  # (para sideload, p.ex. AltStore/Sideloadly). Não precisa de conta Apple.
  ios-unsigned:
    name: LMDS iOS (sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: master
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - *pub_get
      - *test
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: Empacotar .ipa
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr LMDS-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/LMDS-unsigned.ipa
    publishing:
      email:
        recipients:
          - antoniopontopedro@gmail.com
        notify:
          success: true
          failure: true

  # iOS assinado para TestFlight / App Store. Requer conta Apple Developer e
  # uma integração App Store Connect criada no Codemagic (Team settings >
  # Integrations) com o nome indicado em "app_store_connect" abaixo.
  # Bundle ID registado no portal da Apple: pt.lmds.lmdsApp
  ios-testflight:
    name: LMDS iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pt.lmds.lmdsApp
    scripts:
      - *pub_get
      - *test
      - name: Perfis de assinatura
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
